name: Qualité et sécurité

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Composants SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Synchroniser les assets
        run: |
          grep -v 'rel="manifest"' index.html > android/app/src/main/assets/webapp/index.html
          cp ui-system.css android/app/src/main/assets/webapp/ui-system.css
      - name: Compiler les trois variantes
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
